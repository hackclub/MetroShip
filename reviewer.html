<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MetroShip | Reviewer</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar container">
                <div class="title">
                    <h1 style="color:rgb(255, 0, 0);"><a href="index.html">Welcome To MetroShip!</a></h1>
                </div>
                <div class="banner-image">
                    <img src="images/Transit Banner.png" width="95%" height="50%">
                </div>
                <div class="main-menu">
                    <ul>
                        <li><h4 id="htuser-status"></h4></li>
                        <br>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="#" id="htlogin-link"></a></li>
                        <li><a href="#" id="projects">Projects</a></li>
                        <li><a href="#" id="prizes">Prizes</a></li>
                        <li><a href="#" id="htlogout-link"></a></li>
                        <li><a href="reviewer.html" id="reviewer-link" style="display:none; color:rgb(255,0,144);">Reviewer</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div style="padding: 2% 4%;">
            <h2 style="color: rgb(255, 0, 144); font-family: 'Nasalization'; font-size: 2.5vw; margin-bottom: 16px;">
                Reviewer Dashboard
            </h2>

            <div id="reviewer-gate" style="display:none;">
                <p style="color:red; font-size:1.5vw;">Access denied. You are not authorized to view this page.</p>
            </div>

            <div id="reviewer-content" style="display:none;">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
                    <input id="reviewer-search" type="text" placeholder="Search by name, email, description..."
                        style="background:#111; color:aqua; border:1px solid aqua; border-radius:6px; padding:6px 12px; font-size:1vw; font-family:inherit; width:28vw;">
                    <button id="undo-btn" style="cursor:pointer; padding:6px 14px; font-size:0.95vw; border-radius:6px; border:2px solid #444; background:#111; color:#555; font-family:inherit;" disabled>Undo</button>
                    <span style="color:#888; font-size:0.9vw;">Unverified projects shown first.</span>
                </div>
                <div id="reviewer-projects"></div>
            </div>
        </div>

        <script src="hackatime-auth.js"></script>
        <script src="reviewer.js"></script>
    </body>
</html>
