<div style="background: rgba(10, 10, 10, 0.95); color: aqua; padding: 4vw; border-radius: 20px; width: 80%;  margin: 10vh auto; position: relative; border: 2px solid aqua; box-shadow: 0 0 50px rgba(0, 255, 255, 0.4); text-align: center; font-family: 'Lexend Giga';">
    <button class="close-btn" style="position: absolute; top: 1vw; right: 2vw; background: none; border: none; color: #ff0000; font-size: 3vw; cursor: pointer; font-family: 'Nasalization';">&times;</button>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2vw;">
        {{IMAGE_HTML}}
        
        <div>
            <h1 style="font-family: 'Nasalization'; font-size: 3.5vw; color: rgb(255, 0, 144); margin: 0;">{{NAME}}</h1>
            <h2 style="color: limegreen; font-size: 2vw; margin: 10px 0;">Cost: {{TICKETS}}</h2>
            <p style="font-size: 1.4vw; line-height: 1.5; color: white; margin-top: 20px;">{{DESCRIPTION}}</p>
        </div>

        <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 1vw; width: 100%; margin-top: 1vw;">
            {{ITEMS_HTML}}
        </div>
    </div>
</div>
